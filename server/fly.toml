# NOSTRAS relay + DVM — one Fly app, two process groups sharing the same
# image (see Dockerfile). Only "web" (the relay) is exposed publicly;
# "dvm" has no service block, so it gets no public IP, but can still reach
# "web" over Fly's private network (6PN) since that's automatic per-app
# infra, not something enabled per-service.
#
# App name/region are placeholders — set the real ones at `fly launch`/
# `fly apps create` time (see CLAUDE.md's Fly.io deploy notes for the
# exact command sequence, since this needs Fly account auth this file
# alone can't provide).
app = "nostras"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[processes]
  web = "/app/relay"
  dvm = "/app/dvm"

# Only the relay (web) touches the badger/bluge stores directly, so only
# it gets the volume mounted — both are single-writer, single-process
# embedded stores (see CLAUDE.md), this can't be horizontally scaled.
[[mounts]]
  source      = "nostras_data"
  destination = "/data"
  processes   = ["web"]

[http_service]
  processes           = ["web"]
  internal_port        = 7777
  force_https          = true
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1

# Shared across both processes — harmless, since each binary only reads
# the env vars it actually uses (main.go ignores NOSTRAS_RELAY_URL,
# cmd/dvm/main.go ignores the NOSTRAS_BADGER_PATH/BLUGE_PATH/PORT ones).
[env]
  NOSTRAS_BADGER_PATH = "/data/badger"
  NOSTRAS_BLUGE_PATH  = "/data/bluge"
  NOSTRAS_PORT        = "7777"
  # Real bug found 2026-08-07: without these, both files fall back to
  # envOr's "./..." default, resolved relative to the Dockerfile's runtime
  # WORKDIR (/app) -- the container's own ephemeral filesystem, NOT the
  # /data Volume mounted above. Every machine restart or redeploy was
  # silently wiping analytics history (surfaced by the operator dashboard
  # showing only same-day data 3 days after launch) and, more seriously,
  # every push-notification subscription (no user-visible error -- a
  # device just silently stops receiving pushes until it re-enables in
  # Settings). Both now live on the persistent volume, same as badger/bluge.
  NOSTRAS_ANALYTICS_PATH            = "/data/analytics.json"
  NOSTRAS_PUSH_SUBSCRIPTIONS_PATH   = "/data/push-subscriptions.json"
  # Real bug found live (2026-08-16), the exact same class as the comment
  # above -- NOSTRAS_WAITLIST_PATH was never set here, so the waitlist
  # store had been living on the container's ephemeral filesystem since
  # the feature launched. Confirmed directly: the file doesn't exist
  # anywhere on the current production machine, meaning every real
  # signup (including a real test entry submitted earlier this project)
  # was silently lost on the next redeploy. Fixed the same way as the
  # others, and NOSTRAS_PAGE_VIEWS_PATH (new this same commit, see
  # pageviews.go) set on the persistent volume from the start rather
  # than left to rediscover this a fifth time.
  NOSTRAS_WAITLIST_PATH             = "/data/node-waitlist.json"
  NOSTRAS_PAGE_VIEWS_PATH           = "/data/page-views.json"
  # Applying the lesson above proactively this time (2026-08-12), not
  # rediscovering it a third time: the NIP-62 vanish-tombstone store
  # (vanish.go) needs the same persistent-volume treatment, set here
  # from the start rather than left on the envOr default.
  NOSTRAS_VANISH_STORE_PATH         = "/data/vanished-pubkeys.json"
  # Same proactive lesson applied a third time (2026-08-13): NIP-86's
  # ban/allow/moderation-queue/admin-grant store (adminapi.go) also needs
  # the persistent volume, set here from the start.
  NOSTRAS_NIP86_STORE_PATH          = "/data/nip86-admin.json"
  # Same lesson a fourth time (2026-08-23): the admin-only relay/identity
  # enumeration stores (enumerate.go) accumulate across scans by design —
  # losing that on every redeploy would defeat the entire point of merging
  # results instead of resetting to a fresh snapshot each run.
  NOSTRAS_ENUMERATE_RELAYS_PATH      = "/data/enumerated-relays.json"
  NOSTRAS_ENUMERATE_IDENTITIES_PATH  = "/data/enumerated-identities.json"
  # Same lesson a fifth time (2026-09-06): the client-heartbeat counter
  # (heartbeat.go) set on the persistent volume from the start, not
  # discovered as ephemeral-storage data loss after the fact.
  NOSTRAS_HEARTBEAT_PATH             = "/data/client-heartbeats.json"
  # NIP-66 relay self-discovery (nip66.go): the address advertised *in*
  # the discovery event's own d tag, not what the self-probe dials (that
  # always stays localhost, same host as the listener). Not a secret —
  # this is exactly the address anyone would already reach the relay at.
  NOSTRAS_RELAY_PUBLIC_URL          = "wss://nostras.app"
  # <process-group>.process.<app>.internal is Fly's private-networking
  # hostname convention for reaching a specific process group without
  # going out over the public internet — confirmed working in production
  # (both this and the health URL below use the exact same convention).
  NOSTRAS_RELAY_URL   = "ws://web.process.nostras.internal:7777"
  # 2026-08-07: the DVM's own health endpoint (see cmd/dvm/health.go),
  # fetched by the relay's /dashboard/health over the same private
  # network path as NOSTRAS_RELAY_URL above, just in the other direction
  # — never exposed publicly, since the "dvm" process group has no
  # [http_service] block at all in this file.
  NOSTRAS_DVM_HEALTH_PORT = "7778"
  NOSTRAS_DVM_HEALTH_URL  = "http://dvm.process.nostras.internal:7778/health"
  # 2026-09-04: the NIP-65 outbox-aggregation cache's own tracking file
  # (outboxcache.go) — set on the persistent volume from the start this
  # time, applying the ephemeral-storage lesson above proactively rather
  # than rediscovering it a sixth time.
  NOSTRAS_OUTBOX_CACHE_PATH = "/data/outbox-cache.json"
  # 2026-09-02: real heap-profile diagnostics for "web" (see pprofserver.go)
  # — added directly after a third real OOM kill on this same machine in
  # about 24 hours, with every prior instance leaving zero evidence behind
  # once Fly's OOM killer wiped the process. Same private-network-only
  # safety property as NOSTRAS_DVM_HEALTH_PORT above: this port is never
  # declared in [http_service] below, so Fly's proxy never routes public
  # traffic to it, regardless of what it listens on.
  NOSTRAS_PPROF_PORT = "6061"

# Split by process group (2026-08-07): "web" (the relay, running badger +
# bluge) repeatedly hit real memory/connection-cap pressure under genuine
# production traffic at 512MB -- confirmed twice in one day at different
# timescales (a fast ~45min crisis, then a slower ~2h recurrence even
# after tuning badger's own memory options down). "dvm" has never shown
# this problem and doesn't touch either embedded store, so it stays at
# the original size -- no reason to pay for memory it doesn't need.
[[vm]]
  size      = "shared-cpu-1x"
  memory    = "512mb"
  processes = ["dvm"]

# "web" moved from shared-cpu-1x to a dedicated performance-1x the same
# day the 1GB memory bump above landed (2026-08-07): the memory fix held
# -- MemAvailable stayed healthy (~390MB+) under the same failure
# conditions that used to OOM it -- but publishes still failed/timed out.
# Confirmed via /proc/stat on the live machine, sampled multiple times
# including immediately after a full stop/start (which normally
# reschedules to different underlying hardware): idle time was 0 and
# "steal" time (CPU the hypervisor gave to other tenants instead of this
# machine) dominated the sampling window, with load average climbing
# past 8 on a single shared vCPU. That's hypervisor-level contention,
# not something app-level tuning or more memory can fix -- a dedicated
# core isn't time-shared with other Fly customers at all. Explicitly
# confirmed with the user before making this (larger) recurring-cost
# change, same as the earlier memory bump. Memory bumped from 1gb to
# 2gb here too, not by choice but by requirement: the first deploy
# attempt failed cleanly (machine left untouched, still on its prior
# healthy config) with "invalid config.guest.memory_mb, minimum
# required 2048 MiB" -- Fly's performance tier has a higher memory
# floor than shared-cpu-1x did. Not wasted: the extra memory is no
# downside given this machine was already comfortably using its 1GB.
#
# Bumped again, 2gb -> 4gb (2026-08-29): a real OOM kill
# (exit_code=137, oom_killed=true) confirmed via the machine's own event
# log, root-caused by direct SSH investigation, not guessed -- /data
# (badger + bluge combined) had genuinely grown to ~2.3GB, larger than
# the machine's entire RAM, so mmap'd store pages alone (RssFile in
# /proc/<pid>/status) accounted for the majority of a ~1.5GB steady-
# state RSS even before the Go runtime's own heap and connection
# buffers. The actual trigger was two back-to-back deploys reopening
# and heavily compacting badger's tables right after boot (several
# 6-25s compactions observed directly in the boot log), needing real
# transient memory on top of an already-tight baseline. Same "the store
# has organically outgrown the machine" pattern as every prior capacity
# bump here, not a code regression -- confirmed with the user first,
# same as every previous recurring-cost change to this app.
#
# CPU bumped 1x -> 2x (2026-09-02): the 2026-08-31 badger block/index
# cache fix (see server/main.go) genuinely helped -- hit ratio rose from
# 0.28 to 0.41 right after deploy -- but it bought headroom against a
# growing store, not a permanent ceiling. A routine health check ~2
# days later found CPU pegged at 90%+ again (confirmed via `top`, twice,
# 5s apart) with real DVM job-pipeline failures (3/3 `nak` publish
# attempts against wss://nostras.app timed out), while the badger query
# rate was unchanged from the original incident (~8,600 gets/sec) --
# meaning real sustained production volume alone is enough to saturate
# one core regardless of cache tuning, once the store (badger 1.7GB ->
# 2.0GB, bluge 1.0GB -> 1.5GB in that same 2 days) keeps growing past
# whatever a fixed cache size covers. Memory left unchanged at 4gb
# deliberately -- RSS was tight (3.67GB/4GB) but not yet OOMing, and a
# second core may relieve some of that pressure indirectly (less data
# queued in flight); a real RAM bump is the honest next step only if
# memory stays tight after this change, not bundled in now on a guess.
# Confirmed with the user first, same as every other recurring-cost
# change to this app.
#
# Memory bumped 4gb -> 8gb (2026-09-04), the "honest next step" the
# entry above explicitly predicted: memory did stay tight after the CPU
# bump. Root-caused precisely this time, not just inferred from
# MemAvailable -- the new private pprof endpoint (server/pprofserver.go,
# added the same day after a third unexplained OOM) let a real heap
# profile be captured live in production for the first time. Verified
# via direct SSH: /data (badger + bluge combined) had grown to 4.2GB --
# larger than this machine's entire prior 4GB allocation -- with
# RssFile (mmap'd store pages) at 2.07GB and RssAnon (the actual Go
# heap, matching the pprof profile) at 1.64GB, summing exactly to the
# observed 3.71GB VmRSS. The cache config itself (256MB block cache +
# 128MB index cache, see main.go) is not the problem; the on-disk store
# has simply outgrown the box, same pattern as the 2gb->4gb bump above,
# now recurring at a larger scale. Confirmed with the user first, same
# as every other recurring-cost change to this app -- and flagged
# honestly at the same time that repeated reactive memory bumps aren't
# a sustainable strategy on their own if the store keeps growing
# unbounded; worth a real look at what's actually accumulating
# (search-index scope, outbox-aggregation cache growth, data retention)
# as a parallel, non-urgent investigation, not assumed solved by RAM
# alone going forward.
[[vm]]
  size      = "performance-2x"
  memory    = "8gb"
  processes = ["web"]
