# NOSTRAS client — a separate Fly app from the relay/DVM (server/fly.toml)
# since this is just static files with no shared build context, state, or
# persistent connections. Originally configured to scale to zero when idle
# (cheaper), but switched to always-warm (min_machines_running = 1,
# auto_stop_machines = false — same shape as the relay) after a real user
# hit a slow/failed load from a cold-started machine while driving traffic
# to the site; worth the small extra cost to avoid that for visitors.
app = "nostras-client"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[build.args]
  VITE_RELAY_URL = "wss://nostras.app"

[http_service]
  internal_port        = 80
  force_https          = true
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1

[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"
