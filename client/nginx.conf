server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Content-hashed filenames (index-<hash>.js etc.) — safe to cache
    # aggressively since a content change always produces a new filename.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else (index.html, sw.js, registerSW.js, workbox-*.js,
    # manifest.webmanifest) is NOT content-hashed — must not be cached, or
    # a service worker update never reaches an already-installed PWA.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
