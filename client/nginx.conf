server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Systemic guardrail against mixed content (2026-08-10), requested
    # directly after a real incident: a stranger's note contained a plain
    # http:// image URL, and it took auditing ten separate React call
    # sites by hand to find and fix every place that could have rendered
    # untrusted http:// content as a real <img>/<video>/<audio> element.
    # Per-component checks (isSecureImageUrl() in parseContent.ts) are
    # real and stay in place — they give a clean link fallback instead of
    # a broken-image icon — but they only cover call sites someone
    # remembered to guard. This header is the backstop: it tells the
    # browser itself to refuse (not silently upgrade-and-hope) any
    # insecure subresource this page ever tries to load, from any code
    # path, present or future, the same "block at the actual boundary,
    # not every call site" principle already used for WebSocket
    # connections in wsGuard.ts.
    #
    # Real nginx gotcha, caught before shipping: add_header does NOT
    # inherit from the server block into a location block that defines
    # its own add_header directives (nginx replaces the whole set, it
    # doesn't merge) — both location blocks below already set their own
    # Cache-Control, so a single server-level add_header here would have
    # been silently dropped for every actual response. Set explicitly in
    # both locations instead of relying on inheritance.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "upgrade-insecure-requests; block-all-mixed-content" always;
    }

    # Everything else (index.html, sw.js, registerSW.js, workbox-*.js,
    # manifest.webmanifest) is NOT content-hashed — must not be cached, or
    # a service worker update never reaches an already-installed PWA.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "upgrade-insecure-requests; block-all-mixed-content" always;
        try_files $uri /index.html;
    }
}
